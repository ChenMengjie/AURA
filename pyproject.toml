[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aura"
version = "0.2.0"
description = "AURA: composition-dependent context variance model for spatial transcriptomics"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Mengjie Chen"}]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "pandas>=1.4",
    "scanpy>=1.9",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = ["pytest", "statsmodels"]

[project.urls]
Homepage = "https://github.com/ChenMengjie/AURA"

[tool.setuptools.packages.find]
include = ["aura*"]
